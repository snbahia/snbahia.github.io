<header>
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark">
        <div class="home p-1 rounded">
            <ul class="navbar-nav">
                <li class="nav-item p-1 rounded">
                    <a class="nav-link smooth-scroll text-uppercase" href="#home" (click)="closeMenu()"><i class='fa fa-home'></i> {{'header.home'
                        | translate}}
                    </a>
                </li>
            </ul>
        </div>
        <button type="button" class="navbar-toggler mb-1" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="navbarSupportedContent" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="container ">
            <div style="width: 100%; float: right;" class="collapse navbar-collapse" [class.show]="menuOpen" id="navbarSupportedContent">
                <ul class="navbar-nav" style=" float: right;">
                    <li class="nav-item p-1 rounded">
                        <a class="nav-link js-scroll-trigger smooth-scroll text-uppercase" href="#about" (click)="closeMenu()"><i
                                class='fa fa-user'></i> {{'header.about' | translate}}
                        </a>
                    </li>
                    <li class="nav-item p-1 rounded">
                        <a class="nav-link js-scroll-trigger smooth-scroll text-uppercase" href="#skills" (click)="closeMenu()"><i
                                class='fa fa-briefcase'></i>{{'header.skills' | translate}}</a>
                    </li>
                    <li class="nav-item p-1 rounded">
                        <a class="nav-link js-scroll-trigger smooth-scroll text-uppercase" href="#cv" (click)="closeMenu()"> <i
                                class='fa fa-file-text-o'></i>CV</a>
                    </li>
                    <li class="nav-item p-1 rounded">
                        <a class="nav-link js-scroll-trigger smooth-scroll text-uppercase" href="#portfolio" (click)="closeMenu()"> <i
                                class='fa fa-folder-open-o'></i>Portfolio</a>
                    </li>
                    <!-- <li class="nav-item p-1 rounded">
                        <a class="nav-link js-scroll-trigger smooth-scroll text-uppercase" href="#references"><i
                                class='bx bxs-badge-check'></i> {{'header.references' | translate}}</a>
                    </li> -->
                    <li class="nav-item p-1 rounded">
                        <a class="nav-link text-uppercase" href="#contact" (click)="closeMenu()"> <i
                                class='fa fa-envelope-o'></i>{{'header.contactMe' | translate}}</a>
                    </li>
                    <li class="nav-item p-1 rounded">
                        
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
