<section id="portfolio">
  <div class="container">
    <h2><strong>{{'projects.title' | translate}}</strong></h2>
    <span class="bar-title mb-5"></span>
    <div class="row">
      <div class="col-md-6 mb-4" [class.col-lg-6]="!!project.summary" [class.col-lg-4]="!project.summary" *ngFor="let project of projects">
        <article class="card project-card h-100" [id]="'project-' + project.id">
          <a *ngIf="project.images.length" [href]="project.images[0].src" target="_blank" rel="noopener noreferrer" class="project-cover" [attr.aria-label]="'Open image: ' + project.images[0].title">
            <img [src]="project.images[0].src" [alt]="project.images[0].title" loading="lazy" width="640" height="420">
          </a>
          <div class="card-body">
            <h3 class="card-title">{{project.name}}</h3>
            <p class="project-technologies">{{project.technologies}}</p>
            <p *ngIf="project.summary" class="project-summary">{{project.summary}}</p>
            <div class="project-actions">
              <button *ngIf="project.detail" type="button" class="btn btn-primary" (click)="detailOnClick(project)" [attr.aria-expanded]="project.detailIsDisplayed" [attr.aria-controls]="project.id + '-details'">{{'projects.projectDetail' | translate}}</button>
              <button *ngIf="project.images.length" type="button" class="btn btn-outline-primary" (click)="project.galleryIsDisplayed = !project.galleryIsDisplayed" [attr.aria-expanded]="project.galleryIsDisplayed" [attr.aria-controls]="project.id + '-gallery'">Images ({{project.images.length}})</button>
              <a *ngIf="project.url" [href]="project.url" target="_blank" rel="noopener noreferrer" class="project-resource">View project</a>
            </div>
            <div [id]="project.id + '-details'" [hidden]="!project.detailIsDisplayed" [innerHTML]="project.detail" class="mt-3"></div>
            <div [id]="project.id + '-gallery'" [hidden]="!project.galleryIsDisplayed" class="project-gallery mt-3">
              <a *ngFor="let image of project.images" [href]="image.src" target="_blank" rel="noopener noreferrer">
                <img [src]="image.src" [alt]="image.title" loading="lazy" width="320" height="210">
                <span>{{image.title}}</span>
              </a>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
