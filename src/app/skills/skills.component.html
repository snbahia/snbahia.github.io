<section id="skills" aria-labelledby="approach-title">
  <div class="container">
    <h2 id="approach-title"><strong>How I like to work</strong></h2>
    <span class="bar-title mb-4"></span>
    <div class="practice-list">
      <article *ngFor="let practice of practices" class="practice">
        <span class="practice-icon" [attr.data-tone]="practice.tone" aria-hidden="true">{{practice.icon}}</span>
        <h3>{{practice.title}}</h3>
        <div>
          <p>{{practice.description}}</p>
        </div>
      </article>
    </div>
    <div class="toolkit">
      <h3>Technical toolkit</h3>
      <dl>
        <div *ngFor="let group of toolkit">
          <dt>{{group.label}}</dt>
          <dd>{{group.value}}</dd>
        </div>
      </dl>
    </div>
  </div>
</section>
